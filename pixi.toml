[workspace]
name = "PhysCode"
version = "0.1.0"
description = "Laboratorio: Python, ROOT e Geant4 su macOS, Linux e WSL2"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]

[dependencies]
python = "3.12.*"
root_base = ">=6.34,<7"
numpy = "*"
scipy = "*"
matplotlib = "*"
pandas = "*"
jupyterlab = "*"
ipykernel = "*"
cmake = ">=3.21,<4"
ninja = "*"
c-compiler = "*"
cxx-compiler = "*"
emacs = ">=30,<32"
markdown = ">=3.11.3,<4"
iminuit = ">=2.33.0,<3"

[activation]
scripts = ["scripts/activate.sh"]

[tasks]
check = "python scripts/check.py"
root-gui = "python scripts/root_gui.py"
notebook = "jupyter lab"
editor = "emacs"
editor-term = "emacs -nw"
